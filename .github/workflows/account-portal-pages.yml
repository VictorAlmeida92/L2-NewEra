name: Account Portal Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/account-portal/**'
      - '.github/workflows/account-portal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/account-portal/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/account-portal
        run: pnpm install --frozen-lockfile
      - name: Build portal
        working-directory: apps/account-portal
        env:
          VITE_BASE_PATH: /L2-NewEra/
        run: pnpm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/account-portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
