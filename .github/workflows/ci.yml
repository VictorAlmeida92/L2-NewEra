name: L2 NewEra CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: l2-newera-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_DB: l2jdb
  POSTGRES_USER: brproject

jobs:
  gradle:
    name: Gradle and architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Assert generated distribution is not versioned
        shell: bash
        run: test ! -e libs/server.jar

      - name: Run build, tests and boundary checks
        run: >-
          ./gradlew --no-daemon --no-parallel
          :app-dist:jar
          :db-migrate:test
          :extensions-spi:test
          :game-server-core:test
          :mod-pix:test
          :proxy:test
          checkComponentBoundaries
          checkRuntimeScripts
          checkDatabaseSql
          checkDatabaseConnectionBoundary
          checkPersistenceConstructionBoundary

      - name: Verify distribution was generated by this checkout
        shell: bash
        run: test -s libs/server.jar

  docker-smoke:
    name: Docker Compose clean-clone smoke test
    runs-on: ubuntu-latest
    needs: gradle
    timeout-minutes: 30
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Validate Compose definition
        run: docker compose -f deploy/docker/docker-compose.yml config

      - name: Build and start official stack
        run: docker compose -f deploy/docker/docker-compose.yml up -d --build

      - name: Wait for services and inspect readiness
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f deploy/docker/docker-compose.yml)
          for attempt in {1..60}; do
            db_status="$(${compose[@]} ps -q db | xargs -r docker inspect --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            migrate_status="$(${compose[@]} ps -q migrate | xargs -r docker inspect --format '{{.State.Status}}' 2>/dev/null || true)"
            login_ready="$(${compose[@]} logs login-server 2>&1 | grep -c 'Loginserver ready on' || true)"
            game_ready="$(${compose[@]} logs game-server 2>&1 | grep -c 'Netty Game Transport listening successfully' || true)"
            if [[ "$db_status" == "healthy" && "$migrate_status" == "exited" && "$login_ready" -gt 0 && "$game_ready" -gt 0 ]]; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              ${compose[@]} ps
              ${compose[@]} logs --no-color migrate login-server game-server
              exit 1
            fi
            sleep 5
          done
          ${compose[@]} ps
          ${compose[@]} logs --no-color migrate login-server game-server | grep -E 'Success\.|Loginserver ready on|Server loaded|Registered as server|Netty Game Transport listening successfully'

      - name: Tear down temporary stack
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v --remove-orphans
